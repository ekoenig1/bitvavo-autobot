services:
  bitmaster:
    build: .
    container_name: bitvavo_autobot
    ports:
      - "8050:5000"   # Host-Port 8050 -> Container-Port 5000
    env_file:
      - .env
    environment:
      - TZ=Europe/Berlin   # Wichtig: Scheduler-Zeiten (geplante Käufe)
    volumes:
      - bitmaster_data:/app/data   # DB + Logs bleiben bei Container-Neustart erhalten
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, json; json.load(urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5))['status'] == 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  bitmaster_data: